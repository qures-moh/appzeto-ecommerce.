version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: appzeto-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: appzeto_ecommerce

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appzeto-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/appzeto_ecommerce
      JWT_SECRET: supersecretjwtkeyappzeto2026
      CLIENT_URL: http://localhost:5173
      RESERVATION_TTL_MINUTES: 15
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appzeto-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: appzeto-admin
    restart: always
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - backend

volumes:
  mongo-data:
